x-mailu-environment: &mailu-environment
  SECRET_KEY: "WID8K4KXKD9TCG5Z"
  SUBNET: "192.168.203.0/24"
  DOMAIN: "byblume.fr"
  HOSTNAMES: "mail.byblume.fr"
  POSTMASTER: "admin"

  TLS_FLAVOR: "letsencrypt"

  AUTH_RATELIMIT_IP: "5/hour"
  AUTH_RATELIMIT_USER: "50/day"

  DISABLE_STATISTICS: "True"

  ADMIN: "true"
  WEBMAIL: "none"
  API: "false"
  WEBDAV: "radicale"

  ANTIVIRUS: "clamav"
  SCAN_MACROS: "true"

  MESSAGE_SIZE_LIMIT: "50000000"
  MESSAGE_RATELIMIT: "200/day"

  RELAYNETS: ""
  RELAYHOST: ""

  FETCHMAIL_ENABLED: "true"
  FETCHMAIL_DELAY: "600"

  RECIPIENT_DELIMITER: "+"

  DMARC_RUA: "admin"
  DMARC_RUF: "admin"

  WELCOME: "false"
  WELCOME_SUBJECT: "Welcome to your new email account"
  WELCOME_BODY: "Welcome to your new email account, if you can read this, then it is configured properly!"

  COMPRESSION: ""
  COMPRESSION_LEVEL: ""

  FULL_TEXT_SEARCH: "en"

  WEBROOT_REDIRECT: "/admin"
  WEB_ADMIN: "/admin"
  WEB_WEBMAIL: "/webmail"
  WEB_API: "/api"

  SITENAME: "BlumeMail"
  WEBSITE: "https://byblume.fr"

  CREDENTIAL_ROUNDS: "12"

  REAL_IP_HEADER: ""
  REAL_IP_FROM: ""

  REJECT_UNLISTED_RECIPIENT: ""

  LOG_LEVEL: "INFO"
  TZ: "Etc/UTC"

  DEFAULT_SPAM_THRESHOLD: "80"

  API_TOKEN: ""

  FULL_TEXT_SEARCH_ATTACHMENTS: "true"


services:

  # ---------------------------------------------------------
  # Umbrel reverse proxy
  # ---------------------------------------------------------

  app_proxy:
    environment:
      APP_HOST: game-mailu_front_1
      APP_PORT: 80


  # ---------------------------------------------------------
  # External dependencies
  # ---------------------------------------------------------

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - ${APP_DATA_DIR}/redis:/data
    networks:
      - mailu_internal
    depends_on:
      - resolver


  # ---------------------------------------------------------
  # Mailu front
  # ---------------------------------------------------------

  front:
    image: ghcr.io/mailu/nginx:2024.06
    restart: always

    environment:
      <<: *mailu-environment

    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "110:110"
      - "995:995"
      - "143:143"
      - "993:993"
      - "4190:4190"

    networks:
      - default
      - mailu_internal
      - radicale

    volumes:
      - ${APP_DATA_DIR}/certs:/certs
      - ${APP_DATA_DIR}/overrides/nginx:/overrides:ro

    depends_on:
      - resolver


  # ---------------------------------------------------------
  # DNS resolver
  # ---------------------------------------------------------

  resolver:
    image: ghcr.io/mailu/unbound:2024.06
    restart: always
    environment:
      <<: *mailu-environment
    networks:
      mailu_internal:
        ipv4_address: 192.168.203.254

  # ---------------------------------------------------------
  # Mailu administration
  # ---------------------------------------------------------

  admin:
    image: ghcr.io/mailu/admin:2024.06
    restart: always

    environment:
      <<: *mailu-environment

    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/dkim:/dkim

    networks:
      - mailu_internal

    depends_on:
      - redis
      - resolver


  # ---------------------------------------------------------
  # IMAP / Dovecot
  # ---------------------------------------------------------

  imap:
    image: ghcr.io/mailu/dovecot:2024.06
    restart: always

    environment:
      <<: *mailu-environment

    volumes:
      - ${APP_DATA_DIR}/mail:/mail
      - ${APP_DATA_DIR}/overrides/dovecot:/overrides:ro

    networks:
      - mailu_internal
      - fts_attachments

    depends_on:
      - front
      - fts_attachments
      - resolver


  # ---------------------------------------------------------
  # SMTP / Postfix
  # ---------------------------------------------------------

  smtp:
    image: ghcr.io/mailu/postfix:2024.06
    restart: always

    environment:
      <<: *mailu-environment

    networks:
      - mailu_internal

    volumes:
      - ${APP_DATA_DIR}/mailqueue:/queue
      - ${APP_DATA_DIR}/overrides/postfix:/overrides:ro

    depends_on:
      - front
      - resolver


  # ---------------------------------------------------------
  # OLE tools
  # ---------------------------------------------------------

  oletools:
    image: ghcr.io/mailu/oletools:2024.06
    hostname: oletools
    restart: always

    networks:
      - mailu_internal
      - oletools

    depends_on:
      - resolver


  # ---------------------------------------------------------
  # Full-text attachment extraction
  # ---------------------------------------------------------

  fts_attachments:
    image: apache/tika:latest-full
    hostname: tika
    restart: always

    networks:
      - fts_attachments

    depends_on:
      - resolver

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -nv -t1 -O /dev/null http://127.0.0.1:9998/tika || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s


  # ---------------------------------------------------------
  # Rspamd antispam
  # ---------------------------------------------------------

  antispam:
    image: ghcr.io/mailu/rspamd:2024.06
    hostname: antispam
    restart: always

    environment:
      <<: *mailu-environment

    networks:
      - mailu_internal
      - oletools
      - clamav

    volumes:
      - ${APP_DATA_DIR}/filter:/var/lib/rspamd
      - ${APP_DATA_DIR}/overrides/rspamd:/overrides:ro

    depends_on:
      - front
      - redis
      - oletools
      - antivirus
      - resolver


  # ---------------------------------------------------------
  # ClamAV antivirus
  # ---------------------------------------------------------

  antivirus:
    image: clamav/clamav-debian:1.4
    restart: always

    networks:
      - clamav

    volumes:
      - ${APP_DATA_DIR}/clamav:/var/lib/clamav

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kill -0 `cat /tmp/clamd.pid` && kill -0 `cat /tmp/freshclam.pid`"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s


  # ---------------------------------------------------------
  # Radicale WebDAV
  # ---------------------------------------------------------

  webdav:
    image: ghcr.io/mailu/radicale:2024.06
    restart: always

    volumes:
      - ${APP_DATA_DIR}/dav:/data

    networks:
      - radicale


  # ---------------------------------------------------------
  # Fetchmail
  # ---------------------------------------------------------

  fetchmail:
    image: ghcr.io/mailu/fetchmail:2024.06
    restart: always

    environment:
      <<: *mailu-environment

    networks:
      - mailu_internal

    volumes:
      - ${APP_DATA_DIR}/data/fetchmail:/data

    depends_on:
      - admin
      - smtp
      - imap
      - resolver


# -----------------------------------------------------------
# Networks
# -----------------------------------------------------------

networks:
  default:
    external: true
    name: umbrel_main_network

  mailu_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.203.0/24

  radicale:
    driver: bridge

  clamav:
    driver: bridge

  oletools:
    driver: bridge
    internal: true

  fts_attachments:
    driver: bridge
    internal: true
